bundle:
  name: weather_pipeline

variables:
  catalog:  { default: workspace }
  schema:   { default: demo }

resources:
  jobs:
    weather_pipeline:
      name: "Weather Pipeline — Bronze → Silver → Gold"

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"

      email_notifications:
        on_failure:
          - kevinnnava0101@gmail.com

      job_clusters:
        - job_cluster_key: weather_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
              spark.databricks.cluster.profile: "singleNode"
            custom_tags:
              ResourceClass: "SingleNode"

      tasks:
        - task_key: bronze_ingest_weather
          job_cluster_key: weather_cluster
          spark_python_task:
            python_file: bronze/ingest_weather.py
          libraries:
            - pypi: { package: requests }

        - task_key: silver_clean_weather
          job_cluster_key: weather_cluster
          depends_on:
            - task_key: bronze_ingest_weather
          spark_python_task:
            python_file: silver/clean_weather.py

        - task_key: gold_weather_summary
          job_cluster_key: weather_cluster
          depends_on:
            - task_key: silver_clean_weather
          spark_python_task:
            python_file: gold/weather_summary.py
